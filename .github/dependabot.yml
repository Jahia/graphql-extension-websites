# Dependabot version update configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # Jahia platform version (parent and org.jahia.* deps) is pinned deliberately.
      - dependency-name: "org.jahia.*"
      # OSGi spec artifacts change Require-Capability / Import-Package ranges.
      - dependency-name: "org.osgi:*"
      # GraphQL libraries are provided by the Jahia platform (graphql-dxm-provider).
      - dependency-name: "com.graphql-java:*"
      - dependency-name: "com.graphql-java-kickstart:*"
      - dependency-name: "io.github.graphql-java:*"
      # slf4j-api is provided by the platform: stay on the 2.0.x line.
      - dependency-name: "org.slf4j:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # cross-fetch >= 3.2.0 hands back an unbound window.fetch; under @jahia/cypress 7 the e2e
      # GraphQL calls then fail with "TypeError: Illegal invocation" (2026-11 e2e runs). Stay on
      # 3.1.x until this harness moves to @jahia/cypress 8, where cross-fetch 4 works.
      - dependency-name: "cross-fetch"
        versions: [">=3.2.0"]
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
